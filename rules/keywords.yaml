# The keyword baseline's word list (M12): the kind of restricted-word filter this project replaces.
#
# Frozen before the baseline's first run on the receipts; check the git history. Written from the
# taxonomy's examples and common words, not from the receipts. No brand names, so it misses
# "Marlboro" or "Barolo" exactly as a real word list would. The assistant that wrote it had seen the
# receipt lines, so treat its score as optimistic.
#
# Matching (validator/baseline.py): NFKC, casefold and accents stripped on both sides; whole words
# with an optional plural "s"/"es"; Japanese terms match as substrings. Any restricted match wins over
# any non-restricted one, the longest term breaks ties, and a line with no match is `other`.
# Restricted categories list terms in all six languages (en, es, fr, de, pt, ja); the others in English.

