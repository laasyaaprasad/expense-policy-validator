# The expense policies as data. The engine reads thresholds, scopes and overrides from here;
# the reporter quotes `evidence`, which must be verbatim policy text (tests/test_rules_config.py).
# Drafted by an AI assistant from data/policy-docs/ and checked against the policy text by tests.

# Data dictionary: entity derives from employee_country.
regions:
  APAC: [IN, JP, SG]
  EMEA: [GB, DE, FR, NL, IE, PT, ES]

# MEAL-01: travel is international when the receipt currency differs from the home country's.
home_currency:
  US: USD
  IN: INR
  JP: JPY
  SG: SGD
  GB: GBP
  DE: EUR
  FR: EUR
  NL: EUR
  IE: EUR
  PT: EUR
  ES: EUR

# merchant-category-risk.md. Any MCC not listed is low risk.
mcc_risk:
  high: ["5921", "5993", "7995", "7297", "5944"]
  medium: ["5813", "5912", "5311", "5411", "5732"]
  low: ["5812", "7011", "4111", "4121", "5942", "5943", "5734", "7216"]

# ALC-01/02 scope: restaurants, bars and hotels serve alcohol on the premises. Elsewhere is retail (ALC-03).
on_premises_mccs: ["5812", "5813", "7011"]

# MEAL-01: a meal receipt is one declared as one of these types.
meal_expense_types: [Meals - Individual, Meals - Team, Client Entertainment]

# DOC-03: the categories each declared expense type covers.
expense_type_covers:
  Meals - Individual: [food_beverage, alcohol]
  Meals - Team: [food_beverage, alcohol]
  Client Entertainment: [food_beverage, alcohol]
  Client Gifts: [gift, gift_card, jewelry]
  Lodging: [lodging, ground_transport, laundry_service]
  Travel - Other: [laundry_service, health_otc, ground_transport, clothing, personal_care]
  Office Supplies: [office_supplies, computer_accessory]
  Computer Equipment: [computer_accessory, personal_electronics, software_subscription]
  Software: [software_subscription]

# EXC-02: what kind of reference each pre_approval_ref prefix records.
reference_prefixes:
  PA-: pre_approval

# Transaction-pattern rules are out of scope on this track.
out_of_scope: [TIME-01, TIME-02, TIME-03, TIME-04]

rules:
  # --- meals-and-entertainment-policy.md ---
  - id: MEAL-01
    doc: meals-and-entertainment-policy.md
    kind: exception
    severity: medium
    scope: receipt
    tier: 1
    params: {domestic_cap_usd: 75, international_cap_usd: 100}
    applies_to: {expense_types: [Meals - Individual, Meals - Team, Client Entertainment]}
    evidence: >-
      Meal spend is capped at $75 per person per day for domestic travel and $100 per person per
      day for international travel. Spend above the cap is a medium exception.

  - id: MEAL-02
    doc: meals-and-entertainment-policy.md
    kind: exception
    severity: low
    scope: receipt
    tier: 2
    params: {total_threshold_usd: 150}
    applies_to: {expense_types: [Meals - Individual, Meals - Team, Client Entertainment]}
    evidence: >-
      Any meal receipt (as defined in MEAL-01) whose receipt total is above $150 in USD must record
      the number of attendees. A missing attendee count is a low exception.

  - id: ALC-01
    doc: meals-and-entertainment-policy.md
    kind: exception
    severity: high
    scope: items
    tier: 1
    params: {min_attendees: 2}
    applies_to: {categories: [alcohol]}
    evidence: >-
      Alcohol is reimbursable only on a receipt declared as Client Entertainment that records an
      attendee count of two or more.

  - id: ALC-02
    doc: meals-and-entertainment-policy.md
    kind: exception
    severity: medium
    scope: items
    tier: 1
    params: {cap_per_attendee_usd: 30}
    applies_to: {categories: [alcohol]}
    evidence: >-
      Where alcohol is permitted under ALC-01, it is capped at $30 per attendee: the USD total of
      the alcohol lines, divided by the attendee count.

  - id: ALC-03
    doc: meals-and-entertainment-policy.md
    kind: exception
    severity: high
    scope: items
    tier: 1
    applies_to: {categories: [alcohol]}
    evidence: >-
      Alcohol purchased from a package store, liquor store, or any other merchant that is not a
      restaurant, bar or hotel is never reimbursable, regardless of business context.

  - id: ENT-01
    doc: meals-and-entertainment-policy.md
    kind: exception
    severity: medium
    scope: items
    tier: 2
    applies_to: {item_kinds: [entertainment_venue]}
    requires_reference: vp_approval
    evidence: >-
      Golf, sporting events, theatre, concerts, and similar venue spend requires prior VP approval,
      recorded as an approval reference (see EXC-02).

  - id: ENT-02
    doc: meals-and-entertainment-policy.md
    kind: exception
    severity: high
    scope: items
    tier: 2
    applies_to: {categories: [gambling]}
    evidence: Gambling spend of any kind is prohibited and is a high exception.

  # --- technology-and-equipment-policy.md ---
  - id: TECH-01
    doc: technology-and-equipment-policy.md
    kind: exception
    severity: high
    scope: items
    tier: 1
    applies_to: {categories: [personal_electronics]}
    evidence: Personal electronics are not reimbursable.

  - id: TECH-02
    doc: technology-and-equipment-policy.md
    kind: exception
    severity: medium
    scope: items
    tier: 1
    params: {unit_price_cap_usd: 200}
    applies_to: {categories: [computer_accessory]}
    requires_reference: pre_approval
    evidence: >-
      Any accessory or peripheral above $200 requires a pre-approval reference (see EXC-02);
      without one it is a medium exception.

  - id: TECH-03
    doc: technology-and-equipment-policy.md
    kind: exception
    severity: high
    scope: items
    tier: 2
    applies_to: {item_kinds: [mobile_phone]}
    evidence: >-
      Mobile phone hardware is procured centrally by IT and is never reimbursable on an expense
      report.

  - id: TECH-04
    doc: technology-and-equipment-policy.md
    kind: exception
    severity: low
    scope: items
    tier: 1
    applies_to: {categories: [software_subscription]}
    requires_reference: manager_approval
    evidence: >-
      Any software or SaaS subscription on an expense report requires a manager approval reference
      (see EXC-02).

  # --- gifts-and-awards-policy.md ---
  - id: GIFT-01
    doc: gifts-and-awards-policy.md
    kind: exception
    severity: medium
    scope: items
    tier: 1
    params: {cap_per_recipient_usd: 50, name_required_from_usd: 10}
    applies_to: {expense_types: [Client Gifts], names_recipient: true}
    evidence: Gifts to clients and prospects are capped at $50 per recipient per occasion.

  - id: GIFT-02
    doc: gifts-and-awards-policy.md
    kind: exception
    severity: high
    scope: items
    tier: 1
    applies_to: {categories: [gift_card]}
    evidence: >-
      Gift cards, prepaid cards, vouchers, and any other cash equivalent are never reimbursable, at
      any amount and for any recipient.

  - id: GIFT-03
    doc: gifts-and-awards-policy.md
    kind: exception
    severity: medium
    scope: items
    tier: 2
    applies_to: {recipient_types: [employee]}
    evidence: >-
      Recognition gifts for employees must be processed through HR and are not reimbursable on an
      expense report.

  - id: GIFT-04
    doc: gifts-and-awards-policy.md
    kind: exception
    severity: critical
    scope: items
    tier: 1
    applies_to: {recipient_types: [government_official]}
    line_overrides: [GIFT-01]
    evidence: >-
      Gifts, meals, or anything of value provided to a government official, public employee, or
      state-owned enterprise employee are prohibited under our anti-corruption policy, at any
      amount.

  # --- non-reimbursable-items.md ---
  - id: PERS-01
    doc: non-reimbursable-items.md
    kind: exception
    severity: medium
    scope: items
    tier: 1
    params: {baggage_allowance_usd: 150, min_delay_hours: 24}
    applies_to: {categories: [personal_care]}
    requires_reference: baggage_delay
    evidence: >-
      Toiletries, cosmetics, razors, haircuts, salon services, spa treatments, and massage are not
      reimbursable.

  - id: PERS-02
    doc: non-reimbursable-items.md
    kind: exception
    severity: medium
    scope: items
    tier: 1
    params: {baggage_allowance_usd: 150}
    applies_to: {categories: [clothing]}
    requires_reference: baggage_delay
    evidence: >-
      Clothing, footwear, and fashion accessories such as belts, ties and bags are not
      reimbursable; a medium exception.

  - id: PERS-03
    doc: non-reimbursable-items.md
    kind: exception
    severity: high
    scope: items
    tier: 1
    applies_to: {categories: [tobacco]}
    evidence: Cigarettes, cigars, loose tobacco, vaping devices and e-liquids are not reimbursable.

  - id: HOUSE-01
    doc: non-reimbursable-items.md
    kind: exception
    severity: medium
    scope: items
    tier: 1
    applies_to: {categories: [household_goods]}
    evidence: >-
      Cleaning supplies, laundry products, household paper goods (paper towels, toilet paper,
      tissues), kitchenware and drinkware, bedding, furniture, small appliances, and home décor are
      not reimbursable, whether bought for home or for an office — office stock of this kind is
      bought centrally.

  - id: HEALTH-01
    doc: non-reimbursable-items.md
    kind: exception
    # The only rule with two severities (data dictionary).
    severity: {otc: low, prescription: medium}
    scope: items
    tier: 2
    params: {trip_cap_usd: 25}
    applies_to: {categories: [health_otc], item_kinds: [prescription_medication]}
    evidence: >-
      OTC medication is reimbursable only on a receipt linked to a trip, up to $25 in total across
      all of that trip's receipts.

  - id: LAUNDRY-01
    doc: non-reimbursable-items.md
    kind: exception
    severity: low
    scope: items
    tier: 1
    params: {min_trip_nights: 4}
    applies_to: {categories: [laundry_service]}
    evidence: Reimbursable only on trips of four or more nights, using the trip length on the receipt.

  # --- merchant-category-risk.md ---
  - id: MCC-01
    doc: merchant-category-risk.md
    kind: exception
    severity: high
    scope: receipt
    tier: 1
    applies_to: {mcc_risk: [high]}
    evidence: >-
      A transaction at a high-risk MCC raises a high exception on its own, whatever the line items
      say.

  - id: MCC-02
    doc: merchant-category-risk.md
    kind: review_signal
    tier: 1
    applies_to: {mcc_risk: [medium]}
    evidence: A medium-risk MCC raises a review signal only.

  - id: MCC-03
    doc: merchant-category-risk.md
    kind: mechanic
    evidence: >-
      A bar (MCC 5813) serves alcohol on the premises, so ALC-01 and ALC-02 apply to it exactly as
      they do to a restaurant, and it is never treated as retail under ALC-03.

  # --- receipt-documentation-requirements.md ---
  - id: DOC-01
    doc: receipt-documentation-requirements.md
    kind: exception
    severity: medium
    scope: receipt
    tier: 1
    params: {total_threshold_usd: 75}
    applies_to: {always: true}
    evidence: Any receipt with a total above $75 (in USD) must be itemized.

  - id: DOC-02
    doc: receipt-documentation-requirements.md
    kind: exception
    severity: medium
    scope: receipt
    tier: 2
    applies_to: {always: true}
    evidence: A receipt must show the merchant name, the transaction date, and the total.

  - id: DOC-03
    doc: receipt-documentation-requirements.md
    kind: exception
    severity: medium
    scope: receipt
    tier: 1
    applies_to: {always: true}
    evidence: >-
      A receipt is misclassified when none of its line items belongs to a category that its
      declared expense type covers.

  - id: DOC-04
    doc: receipt-documentation-requirements.md
    kind: exception
    severity: medium
    scope: receipt
    tier: 2
    applies_to: {always: true}
    evidence: >-
      Receipts in a currency other than USD must record the transaction currency and the conversion
      rate used; a receipt missing either is a medium exception.

  # --- regional-addendum.md ---
  - id: REG-01
    doc: regional-addendum.md
    kind: exception
    severity: high
    scope: items
    tier: 1
    applies_to: {regions: [APAC], categories: [alcohol]}
    overrides: [ALC-01, ALC-02, ALC-03]
    evidence: >-
      Alcohol is never reimbursable for APAC-entity employees, including within client
      entertainment.

  - id: REG-02
    doc: regional-addendum.md
    kind: exception
    severity: medium
    scope: receipt
    tier: 2
    params: {cap_usd: 60}
    applies_to: {regions: [APAC], expense_types: [Meals - Individual, Meals - Team, Client Entertainment]}
    overrides: [MEAL-01]
    evidence: >-
      The APAC daily meal cap is $60 per person, replacing both MEAL-01 figures for APAC employees.

  - id: REG-03
    doc: regional-addendum.md
    kind: exception
    severity: medium
    scope: receipt
    tier: 2
    params: {cap_eur: 70}
    applies_to: {regions: [EMEA], expense_types: [Meals - Individual, Meals - Team, Client Entertainment]}
    overrides: [MEAL-01]
    evidence: >-
      The EMEA daily meal cap is EUR 70 per person, replacing both MEAL-01 figures for EMEA
      employees.

  - id: REG-04
    doc: regional-addendum.md
    kind: exception
    severity: low
    scope: receipt
    tier: 2
    params: {threshold_eur: 50}
    applies_to: {regions: [EMEA], always: true}
    evidence: >-
      Receipts above EUR 50 — converted at the euro rate on the transaction date for a receipt in
      another currency — must be valid VAT receipts showing the merchant VAT number.

  - id: REG-05
    doc: regional-addendum.md
    kind: mechanic
    evidence: >-
      Currency conversion uses the rate on the transaction date, which must be recorded on the
      expense record.

  # --- approval-and-exception-handling.md ---
  - id: EXC-01
    doc: approval-and-exception-handling.md
    kind: mechanic
    evidence: >-
      A receipt's disposition is determined by the most severe exception raised against it

  - id: EXC-02
    doc: approval-and-exception-handling.md
    kind: mechanic
    evidence: >-
      Where a rule requires such a reference, a recorded one satisfies that rule and no exception
      is raised — provided it is the kind the rule asks for

  - id: EXC-03
    doc: approval-and-exception-handling.md
    kind: mechanic
    evidence: >-
      Where the category of an item cannot be determined with sufficient confidence, raise a review
      signal with rule ID EXC-03 rather than an exception, and leave that item out of every other
      rule's calculation for the receipt.

  - id: EXC-04
    doc: approval-and-exception-handling.md
    kind: mechanic
    evidence: >-
      Every exception must cite the rule identifier, the policy document it comes from, and the
      line items it concerns.
