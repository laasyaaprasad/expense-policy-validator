source: experiments/semantic_v3 (experiment 8) for the model, memory and two-key rule;
  experiments/semantic_v4 (experiment 12) for the memory rule. Recalibrate on reviewed
  company receipts before production
model:
  name: Qwen/Qwen3-Embedding-0.6B
  revision: 97b0c614be4d77ee51c0cef4e5f07c00f9eb65b3
  instruction: 'Instruct: Identify what kind of product or service this expense receipt
    line is

    Query: '
tau_mem: 0.854605
tau_fam: 0.84
delta: 0.1
safe_cutoff: 0.108108
memory_confidence: 0.995
curated_confidence: 0.96
two_key_confidence: 0.9
memory_rule: word_by_word
tau_word: 0.934288
block_tau: 0.854605
# decide: the lookup decides the lines it can (every word accounted for, by meaning, a line a person reviewed, and no
# restricted line close); the model decides the rest. `shadow` is the kill switch: the lookup then only records what
# it would decide and the model decides every line. Recalibrate τ_word on each client's own reviewed receipts
# (python -m validator.calibrate) and watch the lookup report (make lookup-report).
mode: decide
# The share of the lookup's decisions marked in the trace for a person to spot-check (`audit`). The decision stands.
audit_rate: 0.02
