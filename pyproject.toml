[project]
name = "expense-validator"
version = "0.1.0"
description = "Classifies receipt line items and checks each receipt against written expense policies."
requires-python = ">=3.12"
dependencies = [
    "openai>=3.42.0",
    "pandas>=3.1.0",
    "pydantic>=2.14.2",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.1",
    "statsmodels>=0.15.0",
    "streamlit>=1.66.1",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
semantic = [
    "sentence-transformers>=6.2.0",
    "torch>=2.15.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "llm: calls a live model API; needs a key and is excluded from `make test`",
]
